[project]
name = "noi2contiamo-server"
version = "0.0.0"
description = "Server Python sottile di Noi2Contiamo: login, isolamento per famiglia, magazzino dati."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "pydantic>=2.14,<2.15",
    "pydantic-settings>=2.16,<2.17",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<1.21",
    "pwdlib[argon2]>=0.3,<0.4",
    "pyjwt[crypto]>=2.15.1,<3",
    "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<9.3",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noi2contiamo_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
# La cartella `alembic/` delle migrazioni non è il pacchetto alembic.
known-third-party = ["alembic"]
